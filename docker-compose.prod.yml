version: '3.8'

services:
  blog-api:
    build: .
    container_name: blog-api-prod
    expose:
      - "5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./logs:/app/logs
    restart: always
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - blog-network

  nginx:
    build: ./nginx
    container_name: blog-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - blog-api
    restart: always
    networks:
      - blog-network

  db:
    image: postgres:15-alpine
    container_name: blog-db-prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-blog_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-blog_password}
      - POSTGRES_DB=${POSTGRES_DB:-blog_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog-network

  # Optional: Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - blog-network

volumes:
  postgres_data:
  redis_data:

networks:
  blog-network:
    driver: bridge
